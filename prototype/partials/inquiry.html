  <section class="contact container{{inquiry-layout}}" id="{{inquiry-id}}" aria-labelledby="talk-title"><div class="contact-intro"><h2 id="talk-title" class="section-title"><span class="eyebrow">Let's Talk</span> <span class="heading-title">Tell us what you<br>have in mind.</span></h2><p>{{inquiry-intro}}</p></div><div class="contact-form" role="group" aria-label="Your message"><noscript><p>Message delivery is not connected. Enable JavaScript to try the local inquiry fields.</p></noscript><fieldset class="local-fields" disabled><legend class="visually-hidden">Your message</legend><div class="form-row"><div class="field"><label for="contact-name">Name <span>(required)</span></label><input id="contact-name" name="name" autocomplete="name" required maxlength="120"><p class="field-error" id="name-error"></p></div><div class="field"><label for="contact-email">Email <span>(required)</span></label><input id="contact-email" name="email" type="email" autocomplete="email" required maxlength="254"><p class="field-error" id="email-error"></p></div></div><div class="field"><label for="contact-reason">What would you like to talk about?</label><span class="select-wrap"><select id="contact-reason" name="reason"><option value="">Choose a topic</option>{{topic-options}}</select></span></div><div class="field"><label for="contact-product">Chocolate that interests you</label><span class="select-wrap"><select id="contact-product" name="product"><option value="">No particular chocolate</option>{{product-options}}</select></span></div><div class="field"><label for="contact-message">Your message <span>(required)</span></label><textarea id="contact-message" name="message" rows="4" required maxlength="3000"></textarea><p class="field-error" id="message-error"></p></div><button type="button" class="button button-primary preview-message">Send Message</button></fieldset><div class="form-status" role="status" tabindex="-1" hidden></div></div></section>
